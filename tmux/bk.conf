# bk shell: atajos y overlays del workspace. Se carga desde tu tmux.conf con:
#   source-file ~/.bk-shell/tmux/bk.conf
# (install.sh agrega esa línea si se lo permitís). No toca tu prefijo, tu tema ni tus otros atajos.
#
#   alt+n nuevo (chat o workspace) · alt+x terminal · alt+a agentes · alt+g cambios · alt+k comandos · alt+s sesiones · alt+u stats · alt+, customize
#   alt+1…9 workspaces · alt+shift+1…9 agente en el lugar del chat · alt+0 volver · alt+q salir de un agente
# En macOS la tecla Option tiene que mandar Alt (Ghostty: macos-option-as-alt = left;
# iTerm2: Profiles → Keys → Left Option key: Esc+; Terminal: Usar Opción como tecla Meta).

set -g mouse on                 # clics en la tira de sesiones
set -g extended-keys on

# ---------- Barrilete ----------
# prefijo + a : ir a la sesión de agentes de bk (elegir ventana)
bind a if-shell 'tmux has-session -t agents' 'choose-tree -Zw -f "#{==:#{session_name},agents}"' 'display-message "no hay agentes (bk run / bk plan)"'
# prefijo + s : sesiones de Claude estilo Orca (abiertas: saltar · recientes: retomar)
bind s display-popup -w 90% -h 75% -E "bk s"

# Overlays a lo Gentle Shell (sin prefijo): alt+a agentes · alt+g cambios · alt+k comandos · alt+s sesiones
# · alt+u stats · alt+x terminal · alt+, customize · alt+1…9 workspaces · alt+0 volver · alt+q salir de un agente
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#f095c8'   # el de noche; ws_style (bin/bk) lo pone según el tema de cada workspace
bind-key -n M-a display-popup -w 92% -h 88% -d "#{pane_current_path}" -T " ∗ Agents " -E "bk watch --all"
bind-key -n M-g display-popup -w 92% -h 88% -d "#{pane_current_path}" -E "bk changes"
bind-key -n M-k display-popup -w 70% -h 70% -d "#{pane_current_path}" -E "bk palette"
bind-key -n M-s display-popup -w 90% -h 75% -d "#{pane_current_path}" -E "bk s"
# alt+1…9: ir al workspace N de la tira izquierda (orden de creación)
bind-key -n M-1 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 1)"'
bind-key -n M-2 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 2)"'
bind-key -n M-3 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 3)"'
bind-key -n M-4 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 4)"'
bind-key -n M-5 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 5)"'
bind-key -n M-6 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 6)"'
bind-key -n M-7 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 7)"'
bind-key -n M-8 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 8)"'
bind-key -n M-9 run-shell 'tmux switch-client -c "#{client_name}" -t "$(bk _nth 9)"'
# alt+n: Nuevo (chat nuevo en este proyecto o workspace de otro), sin salir del workspace
bind-key -n M-n display-popup -w 70% -h 60% -E "BK_CLIENT='#{client_name}' BK_FROM='#{session_name}' bk new"
# alt+x: terminal rápida del proyecto (sesión term-<proyecto>), flota sobre el workspace y conserva lo que
# dejaste; alt+x de nuevo la esconde. El comando del popup no expande #{…}: el directorio va con -d.
bind-key -n M-x if-shell -F '#{m:term-*,#{session_name}}' {
  detach-client
} {
  display-popup -w 85% -h 75% -d "#{pane_current_path}" -T " ❯ terminal · alt+x esconde " -E "bk term"
}
bind-key -n M-u display-popup -w 92% -h 85% -d "#{pane_current_path}" -E "bk stats"
unbind-key -n M-c
# Customize en alt+, (como cmd+, en macOS). No alt+c: Ghostty pasa cmd+c sin selección y llega como alt+c
bind-key -n M-, display-popup -w 80% -h 60% -d "#{pane_current_path}" -E "bk customize"

# Volver: alt+0 a la sesión anterior; alt+q en la sesión agents vuelve (o cierra el popup del agente)
bind-key -n M-0 switch-client -l
bind-key -n M-q if-shell -F '#{==:#{session_name},agents}' {
  if-shell -F '#{client_last_session}' 'switch-client -l' 'detach-client'
} {
  if-shell -F '#{@bk_guest}' 'run-shell "bk _agent #{session_name} 0"' 'send-keys M-q'
}

# alt+shift+1…9: el agente N de la tira, en el lugar del chat del workspace (alt+q devuelve el orquestador).
# Teclado latinoamericano (shift+1 = !, shift+2 = ", …) y de EE. UU. (shift+2 = @, …)
bind-key -n 'M-!' run-shell 'bk _agent "#{session_name}" 1'
bind-key -n 'M-"' run-shell 'bk _agent "#{session_name}" 2'
bind-key -n 'M-@' run-shell 'bk _agent "#{session_name}" 2'
bind-key -n 'M-#' run-shell 'bk _agent "#{session_name}" 3'
bind-key -n 'M-$' run-shell 'bk _agent "#{session_name}" 4'
bind-key -n 'M-%' run-shell 'bk _agent "#{session_name}" 5'
bind-key -n 'M-&' run-shell 'bk _agent "#{session_name}" 6'
bind-key -n 'M-^' run-shell 'bk _agent "#{session_name}" 6'
bind-key -n 'M-/' run-shell 'bk _agent "#{session_name}" 7'
bind-key -n 'M-(' run-shell 'bk _agent "#{session_name}" 8'
bind-key -n 'M-*' run-shell 'bk _agent "#{session_name}" 8'
bind-key -n 'M-)' run-shell 'bk _agent "#{session_name}" 9'
bind-key -n 'M-S-1' run-shell 'bk _agent "#{session_name}" 1'
bind-key -n 'M-S-2' run-shell 'bk _agent "#{session_name}" 2'
bind-key -n 'M-S-3' run-shell 'bk _agent "#{session_name}" 3'
bind-key -n 'M-S-4' run-shell 'bk _agent "#{session_name}" 4'
bind-key -n 'M-S-5' run-shell 'bk _agent "#{session_name}" 5'
bind-key -n 'M-S-6' run-shell 'bk _agent "#{session_name}" 6'
bind-key -n 'M-S-7' run-shell 'bk _agent "#{session_name}" 7'
bind-key -n 'M-S-8' run-shell 'bk _agent "#{session_name}" 8'
bind-key -n 'M-S-9' run-shell 'bk _agent "#{session_name}" 9'
# prefijo + A : `bk ls` en un popup
bind A display-popup -w 90% -h 50% -E "bk ls; echo; bk tokens | head -2; read -n 1 -s -r -p '  (cualquier tecla para cerrar)'"
# Ventana de un agente que terminó: no acepta teclas; decir cómo seguir
set -g remain-on-exit-format " el agente terminó · prefijo s → enter lo retoma acá · prefijo & cierra la ventana "
# Que la ventana de un agente que terminó se vea marcada
setw -g monitor-activity on
set -g visual-activity off


# Salir de tmux dejando los agentes corriendo: prefijo + D
# (en el estilo Gentleman `d` divide la ventana, así que el detach por defecto no existe)
bind D detach-client


# Popups con el fondo de la terminal (algunos temas los ponen grises)
set -g popup-style 'bg=default,fg=default'
